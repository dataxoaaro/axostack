name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  skill-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check skill references
        run: python3 scripts/check-skill-refs.py
      - name: Test security-audit validators
        run: node --test skills/security-audit/*.test.cjs
